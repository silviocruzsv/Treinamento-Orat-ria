<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MBB · Estúdio de Comunicação</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563EB'/%3E%3Ctext x='16' y='23' font-family='Poppins,Arial' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- MBB · design tokens ---- */
  --brand:#2563EB; --brand-strong:#1D4FD7; --brand-soft:#DCE7FE; --brand-2:#3B82F6;
  --ink:#0D1B2A; --surface-dark:#1F2937;
  --bg:#F5F7FA; --card:#FFFFFF;
  --text:#0F1E30; --muted:#64748B; --line:#E2E8F0;
  --accent:#00BFA6; --accent-soft:#D2F4EF;
  --success:#00BFA6; --success-soft:#D2F4EF;
  --warn:#F59E0B; --warn-soft:#FDECC8;
  --danger:#EF4444; --danger-soft:#FBDDDD;
  --r-4:4px; --r-8:8px; --r-12:12px; --r-16:16px; --r-24:24px;
  --s-4:4px; --s-8:8px; --s-16:16px; --s-24:24px; --s-32:32px; --s-48:48px;
  --shadow-s:0 1px 2px rgba(0,0,0,.05);
  --shadow-m:0 4px 12px rgba(0,0,0,.08);
  --shadow-l:0 12px 24px rgba(0,0,0,.12);
  --font-h:'Poppins',system-ui,-apple-system,sans-serif;
  --font-b:'Poppins',system-ui,-apple-system,sans-serif;
  /* ---- compat aliases (mantêm regras/estilos inline existentes) ---- */
  --ink-2:var(--surface-dark); --paper:var(--bg);
  --amber:var(--brand); --amber-soft:var(--brand-soft);
  --blue:var(--brand-2); --blue-soft:var(--brand-soft);
  --good:var(--accent); --bad:var(--danger);
  --radius:var(--r-16); --radius-s:var(--r-8);
  --shadow:var(--shadow-m);
  --font-d:var(--font-h); --font-m:var(--font-b);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:500;line-height:1.15;margin:0 0 .4em}
h1{font-size:1.9rem}h2{font-size:1.5rem}h3{font-size:1.18rem}h4{font-size:1rem;font-weight:600}
p{margin:0 0 .8em}
a{color:var(--blue)}
button{font-family:var(--font-b);cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-m)}
.muted{color:var(--muted)}
.small{font-size:.83rem}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--ink);color:#DDE6DC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:22px 22px 14px}
.brand .kicker{font-family:var(--font-m);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.brand h1{color:#F3F6EF;font-size:1.32rem;margin:.15em 0 0}
.brand .wave{margin-top:12px;opacity:.9}
.nav{padding:8px 12px 20px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:#C6D2C7;padding:10px 12px;border-radius:var(--radius-s);font-size:.92rem;transition:background .15s,color .15s}
.nav button .ic{width:18px;text-align:center;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:var(--amber);color:#2a1c05;font-weight:600}
.nav .sep{margin:10px 12px 6px;font-family:var(--font-m);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:#7d9084}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:.74rem;color:#8ba193}

.main{padding:34px 40px 80px;max-width:1000px}
.view{display:none;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{font-family:var(--font-m);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.lead{font-size:1.02rem;color:var(--muted);max-width:62ch}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat .n{font-family:var(--font-m);font-size:1.9rem;color:var(--ink);line-height:1}
.stat .l{font-size:.8rem;color:var(--muted);margin-top:6px}
.bar{height:9px;background:#e4e9df;border-radius:99px;overflow:hidden;margin-top:10px}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--amber));border-radius:99px;transition:width .5s}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 15px;border-radius:var(--radius-s);font-size:.9rem;font-weight:500}
.btn:hover{background:var(--ink-2)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#2a1c05}
.btn.amber:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:rgba(20,48,43,.06)}
.btn.rec{background:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:.82rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- Chips ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-size:.82rem;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;font-family:var(--font-m);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--blue-soft);color:#26555a}
.tag.lvl1{background:#e2efe4;color:#2c5c3f}
.tag.lvl2{background:var(--amber-soft);color:#7a5210}
.tag.lvl3{background:#f0dcd6;color:#8a3b2a}

/* ---------- Forms ---------- */
label{display:block;font-size:.82rem;font-weight:600;margin:12px 0 5px;color:var(--ink)}
input[type=text],input[type=number],input[type=password],textarea,select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);
  font-family:var(--font-b);font-size:.92rem;background:#fff;color:var(--text)}
textarea{min-height:70px;resize:vertical}
.out{background:#fff;border:1px dashed var(--line);border-radius:var(--radius-s);padding:14px;white-space:pre-wrap;font-size:.9rem;margin-top:12px}

/* ---------- Accordion ---------- */
.acc{border:1px solid var(--line);border-radius:var(--radius-s);margin-bottom:10px;background:#fff;overflow:hidden}
.acc>summary{padding:13px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:after{content:"+";font-family:var(--font-m);color:var(--amber);font-size:1.1rem}
.acc[open]>summary:after{content:"–"}
.acc .body{padding:2px 16px 16px}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--font-m);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- Recorder / waveform ---------- */
.studio{background:var(--ink);color:#e8efe6;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.studio h3{color:#fff}
.meter{height:64px;display:flex;align-items:center;gap:3px;margin:14px 0;padding:0 4px}
.meter .b{flex:1;background:var(--blue);border-radius:3px;height:6%;transition:height .06s linear}
.meter.live .b{background:var(--amber)}
.rec-time{font-family:var(--font-m);font-size:1.5rem;color:var(--amber)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
video,audio{width:100%;border-radius:var(--radius-s);margin-top:12px;background:#000}

/* rubric slider */
.rub{display:grid;grid-template-columns:1fr 150px 34px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rub input[type=range]{width:100%}
.rub .v{font-family:var(--font-m);text-align:center;font-size:1rem}

.notice{border-left:3px solid var(--amber);background:#fff;padding:12px 16px;border-radius:8px;font-size:.9rem;margin:12px 0}
.notice.warn{border-color:var(--bad)}
.pill{font-family:var(--font-m);font-size:.7rem;padding:2px 8px;border-radius:99px;background:#e4e9df;color:var(--muted)}
.pill.ok{background:#dceee1;color:var(--good)}

/* breathing */
.breath{width:150px;height:150px;border-radius:50%;margin:18px auto;background:radial-gradient(circle,var(--amber-soft),var(--amber));display:flex;align-items:center;justify-content:center;font-family:var(--font-m);color:#3a2a08;transition:transform 1s ease,background 1s}
.breath.big{transform:scale(1.5)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:.88rem;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .3s;z-index:99}
.toast.show{opacity:1}

.menu-toggle{display:none}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:50;width:250px;left:-260px;transition:left .25s}
  .sidebar.open{left:0}
  .main{padding:70px 20px 60px}
  .menu-toggle{display:inline-flex;position:fixed;top:14px;left:14px;z-index:60}
}
</style>
<style>
/* =====================================================
   MBB · camada de marca (sobrepõe o tema base)
   ===================================================== */
h1,h2,h3,h4{font-family:var(--font-h);letter-spacing:-.01em}
h1{font-weight:600}
.mono{font-variant-numeric:tabular-nums;letter-spacing:0}
.eyebrow{color:var(--brand);font-weight:600}
a{color:var(--brand)}

/* ---- lockup da marca ---- */
.brand{padding:22px 20px 16px}
.logo{display:flex;align-items:center;gap:11px}
.logo svg{flex:none}
.wordmark{font-family:var(--font-h);font-weight:700;font-size:1.5rem;color:#fff;line-height:1;letter-spacing:.02em}
.tagline{font-size:.62rem;color:#8aa0b6;letter-spacing:.04em;margin-top:3px}
.product{font-family:var(--font-h);font-weight:500;color:#dbe6f2;margin-top:15px;font-size:1rem}
.brand .kicker{font-family:var(--font-b);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-2);margin-top:3px}

/* ---- navegação ---- */
.nav button{color:#a7b6c6}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:var(--brand);color:#fff;font-weight:600}
.nav .sep{color:#5b7185}
.side-foot{color:#7f95a9;border-top-color:rgba(255,255,255,.08)}

/* ---- botões: Primário / Secundário / Terciário ---- */
.btn{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:var(--shadow-s);border-radius:var(--r-8)}
.btn:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.amber{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.amber:hover{background:var(--brand-strong)}
.btn.secondary{background:transparent;border-color:var(--brand);color:var(--brand);box-shadow:none}
.btn.secondary:hover{background:var(--brand-soft)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text);box-shadow:none}
.btn.ghost:hover{background:#eef2f7}
.btn.rec{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.rec:hover{filter:brightness(1.05)}

/* ---- cards, stats, progresso ---- */
.card{background:var(--card);border-color:var(--line);border-radius:var(--r-16);box-shadow:var(--shadow-s)}
.stat{border-color:var(--line);border-radius:var(--r-12);box-shadow:var(--shadow-s)}
.stat .n{color:var(--brand)}
.bar{background:#e7edf4}
.bar>span{background:linear-gradient(90deg,var(--brand),var(--accent))}

/* ---- chips ---- */
.chip{border-color:var(--line)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---- inputs ---- */
input[type=text],input[type=number],input[type=password],input[type=time],textarea,select{border-color:var(--line);border-radius:var(--r-8)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* ---- estúdio (superfície escura) + medidor ---- */
.studio{background:var(--ink);border-radius:var(--r-16);box-shadow:var(--shadow-m)}
.meter .b{background:var(--brand-2)}
.meter.live .b{background:var(--accent)}
.rec-time{color:var(--accent)}

/* ---- respiração ---- */
.breath{background:radial-gradient(circle,var(--accent-soft),var(--accent));color:#043b35}

/* ---- badges / tags (Sucesso, Em andamento, Atenção, Erro) ---- */
.tag{background:var(--brand-soft);color:#1e40af;border-radius:var(--r-4)}
.tag.lvl1{background:var(--success-soft);color:#046a5c}
.tag.lvl2{background:var(--brand-soft);color:#1e40af}
.tag.lvl3{background:var(--warn-soft);color:#8a5a05}
.pill{background:#eef2f7;color:var(--muted)}
.pill.ok{background:var(--success-soft);color:#046a5c}

/* ---- alertas ---- */
.notice{border-left:4px solid var(--brand);background:var(--brand-soft);color:#173154;border-radius:var(--r-8)}
.notice.warn{border-left-color:var(--warn);background:var(--warn-soft);color:#5c3d05}

/* ---- foco acessível na cor da marca ---- */
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>

<script>
/* ============================================================
   ESTÚDIO DE COMUNICAÇÃO — app de treino (arquivo único)
   Persistência: window.storage (Claude) → localStorage (local) → memória
   ============================================================ */

/* ---------- Storage layer ---------- */
const _mem = {};
const Store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; } }catch(e){}
    try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){}
    return (k in _mem) ? _mem[k] : null;
  },
  async set(k,val){
    const s = JSON.stringify(val);
    try{ if(window.storage){ await window.storage.set(k,s); } }catch(e){}
    try{ localStorage.setItem(k,s); }catch(e){}
    _mem[k]=val;
  }
};
const KEY='cpp-state-v1';
let S = { week:1, done:{}, diary:[], assess:[], records:[], templates:[], settings:{driveClientId:''},
  reminders:{ enabled:false, recTime:'09:00', recDays:'all', writeEnabled:true, writeTime:'14:00', fired:{} } };
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>Store.set(KEY,S),250); }
async function load(){ const d = await Store.get(KEY); if(d) S = Object.assign(S,d); }

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function copy(txt){navigator.clipboard.writeText(txt).then(()=>toast('Copiado')).catch(()=>toast('Não foi possível copiar'));}
function today(){return new Date().toISOString().slice(0,10);}
function pad(n){return String(n).padStart(2,'0');}
function localToday(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDate(d){return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});}

/* ============================================================
   DADOS
   ============================================================ */
const NAV = [
  ['painel','◐','Painel'],
  ['plano','▤','Plano 12 semanas'],
  ['modulos','▦','Módulos'],
  ['SEP1','Prática'],
  ['estudio','●','Estúdio de prática'],
  ['biblioteca','⚑','Biblioteca de exercícios'],
  ['templates','▣','Templates'],
  ['SEP2','Acompanhamento'],
  ['avaliacoes','★','Avaliações & rubricas'],
  ['diario','✎','Diário de bordo'],
  ['registros','◉','Meus registros'],
  ['lembretes','◔','Lembretes'],
  ['SEP3','Sistema'],
  ['config','⚙','Configurações'],
];

const PLANO = [
  [1,'Diagnóstico + M1','Diagnóstico; respiração; dicção; saúde vocal','Linha de base; controle da voz','Questionário; gravação diagnóstica; respiração e dicção diárias','Áudio diagnóstico + leitura em voz alta','5–6 h'],
  [2,'M1','Tom, modulação, ritmo, pausas, projeção; postura, gestos, olhar','Modular a voz; alinhar corpo e mensagem','Leitura modulada; vídeo de 2 min; análise de postura','Vídeo de 2 min "quem sou eu"','5–6 h'],
  [3,'M2','Pirâmide de Minto; PREP; STAR; problema–causa–solução','Estruturar respostas em segundos','Exercícios PREP e STAR; reescrever mensagens confusas','5 respostas PREP + 3 STAR gravadas','4–5 h'],
  [4,'M2','Storytelling; narrativa de dados; aberturas; tensão e resolução','Transformar dados em história','Converter um dado em narrativa; abertura forte','Micro-história de dados (90 s)','5–6 h'],
  [5,'M3','Escuta ativa; perguntas; parafraseamento; CNV','Ouvir para compreender; separar fato de julgamento','Prática de escuta; reescrever julgamentos','Diálogo de escuta + 5 frases em CNV','4–5 h'],
  [6,'M3','Assertividade; limites; empatia; conversas difíceis','Posicionar-se com respeito','Simulação de conversa difícil; avaliação intermediária','Simulação gravada + autoavaliação','5–6 h'],
  [7,'M4','Facilitação de reuniões; pauta, papéis, decisões; mudanças','Conduzir reunião eficaz','Montar agenda + ata','Agenda + ata modelo','4–5 h'],

const M1 = `
<div class="eyebrow">Módulo 1 · Nível iniciante · Semanas 1–2</div>
<h2>Fundamentos da Expressão Vocal e Corporal</h2>
<p class="lead">A infraestrutura de tudo o que vem depois: se a voz não é clara e a presença contradiz a fala, nenhum framework salva a mensagem.</p>

<div class="card"><h3>Objetivos de aprendizagem</h3><ol>
<li>Usar a <b>respiração diafragmática</b> como base da fala.</li>
<li>Articular com <b>dicção clara</b>, sem "comer" palavras.</li>
<li><b>Modular</b> tom, ritmo, volume e pausas com intenção.</li>
<li>Reduzir <b>vícios de linguagem</b>, trocando-os por pausas.</li>
<li>Adotar <b>postura aberta</b> e <b>gestos coerentes</b>.</li>
<li>Manter <b>contato visual</b> funcional (presencial e vídeo).</li>
<li>Cuidar da <b>saúde vocal</b>.</li>
<li>Ler sinais não verbais <b>com cautela</b>, sem conclusões precipitadas.</li>
</ol></div>

<div class="card"><h3>Conceitos essenciais</h3>
<details class="acc"><summary>Respiração diafragmática</summary><div class="body"><p>Respirar movendo o <b>diafragma</b> (músculo abaixo dos pulmões), expandindo o abdômen — não só o peito. Dá fôlego e apoio à voz, reduz tensão na garganta e a expiração longa acalma a ansiedade.</p></div></details>
<details class="acc"><summary>Dicção e articulação</summary><div class="body"><p><b>Dicção</b> é a clareza dos sons; <b>articulação</b> é o movimento de lábios, língua e mandíbula que os produz. Dicção é resultado; articulação é mecanismo — e mecanismo se treina.</p></div></details>
<details class="acc"><summary>Tom, modulação e monotonia</summary><div class="body"><p><b>Tom</b> é a altura da voz; <b>modular</b> é variá-lo de propósito para dar sentido. O oposto, <b>monotonia</b>, derruba a atenção. "Nós <i>não</i> vamos cortar o orçamento" muda de sentido conforme a ênfase.</p></div></details>
<details class="acc"><summary>Ritmo, velocidade e pausa</summary><div class="body"><p>Fala confortável em português gira em torno de <b>130–160 palavras/min</b> (referência, não regra). A <b>pausa</b> é a ferramenta mais subestimada: dá ênfase, respiro e elimina muletas.</p></div></details>
<details class="acc"><summary>Projeção e volume</summary><div class="body"><p><b>Projeção</b> é a voz "chegar ao fundo da sala" com apoio respiratório — não é gritar (isso machuca as pregas vocais). Volume adequa-se ao ambiente.</p></div></details>
<details class="acc"><summary>Comunicação não verbal & coerência</summary><div class="body"><p>Tudo que comunica além das palavras: postura, gestos, rosto, olhar, espaço — e a própria voz. <b>Coerência</b> é o alinhamento entre o que se diz, como soa e o que o corpo mostra. <span class="pill">mito</span> "93% é não verbal" (Mehrabian) é citação equivocada: vale só para mensagens emocionais ambíguas.</p></div></details>
</div>

<div class="card"><h3>Técnicas do módulo</h3><ul>
<li><b>Aquecimento em 5 min:</b> respiração → sirene → trava-línguas → leitura projetada.</li>
<li><b>Pausa-substituta:</b> ao sentir vir um "éee", feche a boca e conte 1.</li>
<li><b>Ponto final falado:</b> ao terminar a ideia, baixe o tom e pare.</li>
<li><b>Marcação de texto:</b> antes de ler, marque <b>/ //</b> (pausas) e sublinhe as palavras a enfatizar.</li>
<li><b>3 pontos de apoio:</b> pés firmes, tronco ereto, ombros soltos.</li>
</ul>
<p class="small muted">Pratique cada uma no <b>Estúdio de prática</b>: há timer de respiração, treinador de pausa, contador de palavras/min e caça-vícios.</p></div>

<div class="card"><h3>Erros comuns → correção</h3>
<table><tr><th>Erro</th><th>Correção</th></tr>
<tr><td>Fica sem ar na frase</td><td>Respiração diafragmática; planejar onde respirar</td></tr>
<tr><td>Fala rápido demais</td><td>Pausas deliberadas; medir palavras/min</td></tr>
<tr><td>Monotonia</td><td>Marcar palavras-chave; ler com 3 intenções</td></tr>
<tr><td>Muletas (né/tipo/éee)</td><td>Pausa-substituta; contar muletas/min</td></tr>
<tr><td>Grita para projetar</td><td>Projetar com apoio, não com a garganta</td></tr>
<tr><td>Postura fechada no vídeo</td><td>Câmera na altura dos olhos; olhar na lente</td></tr>
</table></div>

<div class="card"><h3>Checklist</h3>
<p><b>Antes de falar (30 s):</b> respirar fundo 2–3× · 3 pontos de apoio · olhar na lente · primeira frase pensada.</p>
<p><b>Durante:</b> pausa em vez de "éee" · variar tom nas palavras-chave · ritmo controlado · gestos coerentes.</p>
<p><b>Saúde vocal (diário):</b> hidratação · aquecimento antes de falas longas · sem forçar. Rouquidão &gt; 2 semanas → fonoaudiólogo/otorrino.</p></div>

<div class="notice warn"><b>Limitações científicas (leia com atenção).</b>
<ul style="margin:.5em 0 0">
<li><b>Não existe "detector de mentira" corporal.</b> Julgar mentira por gestos/olhar acerta pouco acima do acaso.</li>
<li><b>"Power posing" é controverso:</b> o estudo original não se replicou; sobra um efeito subjetivo modesto de sentir-se mais confiante.</li>
<li>Trate sinais como <b>hipóteses</b>, leia o <b>conjunto</b> e o <b>contexto</b>, e verifique com palavras. Cultura e neurodivergência mudam gestos e olhar.</li>
</ul></div>

<div class="card"><h3>Critérios de domínio</h3><ul>
<li>Média ≥ 3,5 na rubrica do Módulo 1, sem nenhum critério em 1.</li>
<li>≤ 1 vício/min em improviso de 2 min.</li>
<li>Expiração falada sustentada ≥ 10 s.</li>
<li>Consegue apontar, ao rever a gravação, 2 acertos e 2 pontos a melhorar.</li>
</ul>
<p class="small muted">Referências essenciais: Behlau (voz, PT) · Polito (oratória, PT) · Julian Treasure, "How to speak…" (TED, legendas PT). Detalhes e ressalvas no material completo (arquivo .md).</p></div>
`;

function buildNav(){
  const nav=$('#nav'); nav.innerHTML='';
  NAV.forEach(item=>{
    if(item[0].startsWith('SEP')){ nav.appendChild(el('div','sep',item[1])); return; }
    const b=el('button',null,`<span class="ic">${item[1]}</span> ${item[2]}`);
    b.dataset.view=item[0];
    b.onclick=()=>go(item[0]);
    nav.appendChild(b);
  });
}
function go(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  $('#v-'+v).classList.add('active');
  $('#sb').classList.remove('open');
  window.scrollTo(0,0);
  render(v);
}

let mediaStream=null, mediaRec=null, chunks=[], recBlob=null, recURL=null, audioCtx=null, analyser=null, rafId=null, recTimer=null, recSecs=0, recKind='audio';

function setKind(k){recKind=k;
  const a=$('#k-audio'),v=$('#k-video'); if(!a)return;
  a.className='chip'+(k==='audio'?' on':''); a.style.background=k==='audio'?'':'#fff'; a.style.color=k==='audio'?'':'var(--muted)';
  v.className='chip'+(k==='video'?' on':''); v.style.background=k==='video'?'':'#fff'; v.style.color=k==='video'?'':'var(--muted)';
}

async function startRec(){
  try{
    const constraints = recKind==='video'?{audio:true,video:{width:640}}:{audio:true};
    mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
  }catch(e){
    toast('Câmera/microfone bloqueados aqui');
    $('#preview').innerHTML=`<div class="notice warn" style="color:#2a1c05">Não foi possível acessar o microfone/câmera neste ambiente. Salve este arquivo e abra no seu navegador (ou use o gravador nativo do celular) — a ficha do take você registra em "Meus registros".</div>`;
    return;
  }
  chunks=[]; recBlob=null;
  // preview + waveform
  if(recKind==='video'){
    const vid=document.createElement('video'); vid.autoplay=true; vid.muted=true; vid.srcObject=mediaStream;
    $('#preview').innerHTML=''; $('#preview').appendChild(vid);
  } else { $('#preview').innerHTML=''; }
  setupMeter(mediaStream);
  const mime = MediaRecorder.isTypeSupported('video/webm')?'':'';
  mediaRec = new MediaRecorder(mediaStream);
  mediaRec.ondataavailable=e=>{ if(e.data.size)chunks.push(e.data); };
  mediaRec.onstop=finishRec;
  mediaRec.start();
  recSecs=0; $('#rectime').textContent='00:00';
  recTimer=setInterval(()=>{recSecs++; $('#rectime').innerHTML=`<span class="dot"></span> ${mmss(recSecs)}`;},1000);
  $('#btn-rec').disabled=true; $('#btn-stop').disabled=false; $('#postrec').style.display='none';
}
function stopRec(){ if(mediaRec&&mediaRec.state!=='inactive')mediaRec.stop(); }
function finishRec(){
  clearInterval(recTimer); stopMeter();
  $('#btn-rec').disabled=false; $('#btn-stop').disabled=true;
  const type = recKind==='video'?'video/webm':'audio/webm';
  recBlob = new Blob(chunks,{type});
  if(recURL)URL.revokeObjectURL(recURL); recURL=URL.createObjectURL(recBlob);
  const tag = recKind==='video'?'video':'audio';
  $('#preview').innerHTML=`<${tag} controls src="${recURL}"></${tag}>`;
  if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
  $('#postrec').style.display='block';
  toast('Gravação pronta');
}
function mmss(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

function setupMeter(stream){
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=64; src.connect(analyser);
    const bars=document.querySelectorAll('#meter .b'); const data=new Uint8Array(analyser.frequencyBinCount);
    $('#meter').classList.add('live');
    (function draw(){
      analyser.getByteFrequencyData(data);
      bars.forEach((b,i)=>{const v=data[i%data.length]/255; b.style.height=Math.max(6,v*100)+'%';});
      rafId=requestAnimationFrame(draw);
    })();
  }catch(e){}
}
function stopMeter(){ if(rafId)cancelAnimationFrame(rafId); $('#meter')&&$('#meter').classList.remove('live'); document.querySelectorAll('#meter .b').forEach(b=>b.style.height='6%'); if(audioCtx){audioCtx.close();audioCtx=null;} }

function downloadRec(){ if(!recBlob)return; const a=document.createElement('a'); a.href=recURL; a.download=(($('#rec-title').value||'gravacao')+ (recKind==='video'?'.webm':'.webm')); a.click(); logRec(true); }
function logRec(silent){
  const title=$('#rec-title').value.trim()||'Gravação';
  S.records.unshift({id:Date.now(),title,kind:recKind,note:$('#rec-note').value.trim(),date:Date.now(),link:''});
  save(); if(!silent)toast('Registro salvo'); 
}

/* ---------- Drive (credenciais do próprio usuário) ---------- */
let tokenClient=null, accessToken=null;
function initDrive(){
  if(!S.settings.driveClientId){ toast('Configure seu Client ID em Configurações'); go('config'); return; }
  if(typeof google==='undefined'||!google.accounts){ toast('Google não carregou (rode o arquivo localmente)'); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id:S.settings.driveClientId,
    scope:'https://www.googleapis.com/auth/drive.file',
    callback:(resp)=>{ accessToken=resp.access_token; toast('Drive conectado'); doUpload(); }
  });
  tokenClient.requestAccessToken();
}
function uploadRec(){ if(!recBlob){toast('Grave algo primeiro');return;} if(accessToken){doUpload();}else{initDrive();} }
async function doUpload(){
  if(!recBlob||!accessToken)return;
  const name=($('#rec-title').value.trim()||'gravacao')+'.webm';
  const meta={name,mimeType:recBlob.type};
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
  form.append('file',recBlob);
  toast('Enviando ao Drive…');
  try{
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',{
      method:'POST',headers:{Authorization:'Bearer '+accessToken},body:form});
    const d=await r.json();
    if(d.id){ const link=d.webViewLink||('https://drive.google.com/file/d/'+d.id+'/view');
      S.records.unshift({id:Date.now(),title:$('#rec-title').value.trim()||'Gravação',kind:recKind,note:$('#rec-note').value.trim(),date:Date.now(),link});
      save(); toast('Enviado ao Drive'); }
    else { toast('Falha no envio (veja permissões)'); }
  }catch(e){ toast('Erro de rede/permissão no Drive'); }
}

let breathOn=false, breathT=null;
function toggleBreath(){ breathOn=!breathOn; $('#breath-btn').textContent=breathOn?'Parar':'Iniciar ciclo'; if(breathOn)breathCycle(); else{clearTimeout(breathT); $('#breath').className='breath'; $('#breath').textContent='pronto';} }
function breathCycle(){
  if(!breathOn)return; const b=$('#breath');
  b.classList.add('big'); b.textContent='inspira';
  breathT=setTimeout(()=>{ if(!breathOn)return; b.textContent='segura';
    breathT=setTimeout(()=>{ if(!breathOn)return; b.classList.remove('big'); b.textContent='expira';
      breathT=setTimeout(breathCycle,6000);
    },2000);
  },4000);
}

/* ---------- Metrônomo ---------- */
let metro=null;
function toggleMetro(){ if(metro){clearInterval(metro);metro=null;$('#metro-btn').textContent='Iniciar';$('#pulse').classList.remove('big');} else {startMetro();$('#metro-btn').textContent='Parar';} }
function startMetro(){ if(metro)clearInterval(metro); const bpm=+$('#bpm').value; const ms=60000/bpm;
  metro=setInterval(()=>{ const p=$('#pulse'); p.classList.add('big'); setTimeout(()=>p.classList.remove('big'),90);
    try{ const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(); const g=c.createGain(); o.frequency.value=880; o.connect(g);g.connect(c.destination); g.gain.value=.05; o.start(); setTimeout(()=>{o.stop();c.close();},50);}catch(e){}
  },ms); }

/* ---------- WPM ---------- */
function calcWPM(){ const s=+$('#wpm-s').value,w=+$('#wpm-w').value; if(!s||!w){$('#wpm-out').textContent='Preencha os dois campos.';return;}
  const wpm=Math.round(w/s*60); let msg;
  if(wpm<120)msg='Abaixo do confortável — pode soar arrastado. Tente aumentar levemente.';
  else if(wpm<=160)msg='Faixa confortável (≈130–160). Bom ritmo para compreensão.';
  else msg='Rápido demais — a compreensão cai. Insira pausas e desacelere.';
  $('#wpm-out').innerHTML=`<b class="mono" style="font-size:1.3rem">${wpm} palavras/min</b><br><span class="small">${msg}</span>`; }

/* ---------- Caça-vícios ---------- */
let fillOn=false, fillSecs=0, fillCount=0, fillT=null;
function toggleFill(){ fillOn=!fillOn; $('#fill-btn').textContent=fillOn?'Encerrar':'Iniciar sessão';
  if(fillOn){fillSecs=0;fillCount=0;$('#fillc').textContent='0';fillT=setInterval(()=>{fillSecs++;$('#fillt').textContent=mmss(fillSecs);},1000);}
  else{clearInterval(fillT); const perMin=fillSecs?(fillCount/(fillSecs/60)).toFixed(1):'—'; $('#fill-out').innerHTML=`Vícios por minuto: <b class="mono">${perMin}</b> — meta do módulo: ≤ 1,0`;} }
function fillTap(){ if(!fillOn){toast('Inicie a sessão');return;} fillCount++; $('#fillc').textContent=fillCount; }

function saveClient(){S.settings.driveClientId=$('#cfg-client').value.trim();save();toast('Client ID salvo');}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='estudio-comunicacao-backup.json';a.click();toast('Backup exportado');}

/* ============================================================
   LEMBRETES / NOTIFICAÇÕES
   ============================================================ */
function renderLembretes(){
  const r=S.reminders;
  const supported = ('Notification' in window);
  const perm = supported ? Notification.permission : 'indisponível';
  const permPill = perm==='granted'?'<span class="pill ok">permissão concedida</span>'
                 : perm==='denied'?'<span class="pill" style="background:#f0dcd6;color:#8a3b2a">permissão negada</span>'
                 : `<span class="pill">permissão pendente</span>`;
  $('#v-lembretes').innerHTML=`
   <div class="eyebrow">Acompanhamento</div><h1>Lembretes</h1>
   <p class="lead">Empurrõezinhos para praticar na hora certa: gravação na sua janela de 9h–10h em casa, e escrita ao longo do dia.</p>

   <div class="notice warn"><b>Como isto funciona.</b> A notificação do navegador só dispara com o hub <b>aberto</b> numa aba. Para ser avisado com o app fechado (inclusive no celular), use <b>“Baixar para o calendário”</b> — ele cria eventos recorrentes com alarme no seu Google/Apple Calendar.</div>

   <div class="card">
     <div class="row" style="justify-content:space-between">
       <h3 style="margin:0">Notificações no app</h3>${permPill}
     </div>
     <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:8px">
       <input type="checkbox" ${r.enabled?'checked':''} onchange="setRem('enabled',this.checked)"> Ativar lembretes enquanto o hub estiver aberto
     </label>
     <div class="row" style="margin-top:10px">
       <button class="btn amber sm" onclick="reqPerm()">Conceder permissão</button>
       <button class="btn ghost sm" onclick="testNotif()">Testar notificação</button>
     </div>
   </div>

   <div class="grid g2">
     <div class="card"><h3>Gravação (voz e vídeo)</h3>
       <p class="small muted">Sua janela em casa. O lembrete sugere um exercício do dia e leva ao Estúdio.</p>
       <label>Horário</label><input type="time" value="${r.recTime}" onchange="setRem('recTime',this.value)">
       <label>Dias</label>
       <select onchange="setRem('recDays',this.value)">
         <option value="all" ${r.recDays==='all'?'selected':''}>Todos os dias</option>
         <option value="weekdays" ${r.recDays==='weekdays'?'selected':''}>Dias úteis (seg–sex)</option>
       </select>
       <p class="small muted" style="margin-top:10px">Janela sugerida: 9h–10h.</p>
     </div>
     <div class="card"><h3>Escrita</h3>
       <p class="small muted">Pode ser a qualquer momento. O lembrete leva aos Templates.</p>
       <label style="display:flex;align-items:center;gap:8px;font-weight:400">
         <input type="checkbox" ${r.writeEnabled?'checked':''} onchange="setRem('writeEnabled',this.checked)"> Ativar lembrete de escrita
       </label>
       <label>Horário do empurrão</label><input type="time" value="${r.writeTime}" onchange="setRem('writeTime',this.value)">
       <p class="small muted" style="margin-top:10px">Dica: escolha um horário morto do seu dia (ex.: pós-almoço).</p>
     </div>
   </div>

   <div class="card"><h3>Levar para o calendário</h3>
     <p class="small muted">Gera um arquivo <span class="mono">.ics</span> com dois eventos recorrentes e alarme: gravação (${r.recTime}, ${r.recDays==='weekdays'?'seg–sex':'diário'}) e escrita (${r.writeTime}, diário). Importe no Google Calendar (Configurações → Importar) ou abra no celular.</p>
     <button class="btn amber" onclick="buildICS()">Baixar para o calendário (.ics)</button>
   </div>`;
}

let remLoop=null;
function startReminderLoop(){ clearInterval(remLoop); remLoop=setInterval(checkReminders,30000); checkReminders(); }
function toMin(hm){const[a,b]=hm.split(':');return (+a)*60+(+b);}
function daysOk(mode,day){ return mode==='weekdays' ? (day>=1&&day<=5) : true; }
function checkReminders(){
  const r=S.reminders; if(!r.enabled) return;
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes(); const dk=localToday();
  const rec=toMin(r.recTime);
  if(daysOk(r.recDays,now.getDay()) && nowMin>=rec && nowMin<rec+60)
    fireOnce(dk+'|rec','Janela de gravação',recMsg(),'estudio');
  if(r.writeEnabled && nowMin>=toMin(r.writeTime))
    fireOnce(dk+'|write','Exercício de escrita',writeMsg(),'templates');
}
function fireOnce(key,title,body,view){
  if(S.reminders.fired[key]) return;
  S.reminders.fired[key]=true; save();
  try{ const n=new Notification(title,{body}); n.onclick=()=>{window.focus();go(view);n.close();}; }catch(e){ toast(title+': '+body); }
}
function recMsg(){
  const list=EXS.filter(e=>['E1','E3','E4','E5','E6','S1','S2'].includes(e.id));
  const e=list[new Date().getDate()%list.length];
  return `Sugestão de hoje: ${e.id} — ${e.t}. Abra o Estúdio e grave.`;
}
function writeMsg(){
  const o=['Reescreva um e-mail confuso usando o template E-mail executivo.',
           'Pratique uma resposta no formato PREP.',
           'Transforme um dado do seu trabalho em 3 linhas de narrativa.',
           'Escreva um resumo executivo de uma decisão recente.'];
  return o[new Date().getDate()%o.length];
}
function reqPerm(){
  if(!('Notification' in window)){toast('Este navegador não suporta notificações');return;}
  Notification.requestPermission().then(p=>{ renderLembretes(); if(p==='granted'){toast('Notificações ativadas');startReminderLoop();} else toast('Permissão não concedida'); });
}
function setRem(k,v){ S.reminders[k]=v; save(); renderLembretes(); if(k==='enabled'&&v&&('Notification'in window)&&Notification.permission!=='granted')reqPerm(); startReminderLoop(); }
function testNotif(){ if(('Notification'in window)&&Notification.permission==='granted'){ const n=new Notification('Estúdio de Comunicação',{body:'Exemplo de lembrete — bora praticar voz e presença.'}); n.onclick=()=>{window.focus();go('estudio');n.close();}; } else { toast('Conceda a permissão primeiro'); } }

/* ---- Calendário .ics ---- */
function icsStamp(){const d=new Date();return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';}
function nextDT(hm){const[h,m]=hm.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);if(d<new Date())d.setDate(d.getDate()+1);return d;}
function fmtLocal(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';}
function ev(uid,summary,desc,st,en,rrule,alarm){
  return ['BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+icsStamp(),'DTSTART:'+fmtLocal(st),'DTEND:'+fmtLocal(en),
    'SUMMARY:'+summary,'DESCRIPTION:'+desc,rrule,
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+alarm,'TRIGGER:-PT0M','END:VALARM','END:VEVENT'].join('\r\n');
}
function buildICS(){
  const r=S.reminders;
  const recRule = r.recDays==='weekdays'?'RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR':'RRULE:FREQ=DAILY';
  const rs=nextDT(r.recTime), re=new Date(rs.getTime()+60*60000);
  const cal=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Estudio Comunicacao//PT-BR//EN','CALSCALE:GREGORIAN'];
  cal.push(ev('rec-'+Date.now()+'@estudio','Gravar: voz e presença','Janela de gravação 9h as 10h. Abra o hub e grave um exercício de voz ou presença.',rs,re,recRule,'Hora de gravar seu exercício'));
  if(r.writeEnabled){ const ws=nextDT(r.writeTime), we=new Date(ws.getTime()+15*60000);
    cal.push(ev('wr-'+Date.now()+'@estudio','Escrita: exercício de comunicação','Exercício de escrita. Reescreva um e-mail (PREP / e-mail executivo) ou transforme um dado em narrativa.',ws,we,'RRULE:FREQ=DAILY','Exercício de escrita do dia')); }
  cal.push('END:VCALENDAR');
  const blob=new Blob([cal.join('\r\n')],{type:'text/calendar'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='lembretes-comunicacao.ics'; a.click();
  toast('Arquivo de calendário baixado');
}

/* ============================================================
   BOOT
   ============================================================ */
(async function(){
  await load();
  if(!S.reminders) S.reminders={enabled:false,recTime:'09:00',recDays:'all',writeEnabled:true,writeTime:'14:00',fired:{}};
  if(!S.reminders.fired) S.reminders.fired={};
  const t=localToday(); Object.keys(S.reminders.fired).forEach(k=>{ if(!k.startsWith(t)) delete S.reminders.fired[k]; });
  buildNav(); go('painel'); startReminderLoop();
})();
</script>
